name: Autograding Tests

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autograde:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student code
        uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Install Xvfb (virtual display for JPacman GUI tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: FSM suites are adequate
        run: xvfb-run --auto-servernum ./gradlew test --tests 'nl.tudelft.jpacman.fsm.*' -x defaultTest --no-daemon
